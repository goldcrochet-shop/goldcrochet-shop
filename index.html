<meta property="og:title" content="Gold Crochet">
<meta property="og:description" content="Peças únicas, personalizadas e com acabamento premium.">
<meta property="og:type" content="website">
<meta property="og:image" content="./assets/logo.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="dns-prefetch" href="https://raw.githubusercontent.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
<style>
  :root { --gold-deep:#a67c00; --gold-main:#cda434; --gold-light:#e8cd82; --gold-pale:#fbf3df; --white:#fff; --off-white:#fdf9f0; --gray-light:#f3ead2; --gray-mid:#c9b686; --text-dark:#2a2210; --text-mid:#6b5b3a; --danger:#e53e3e; --success:#38a169; --shadow-soft:0 4px 24px rgba(166,124,0,0.13); --shadow-btn:0 6px 20px rgba(205,164,52,0.4); --shadow-card:0 8px 32px rgba(166,124,0,0.12); --radius-pill:999px; --radius-card:20px; --radius-lg:32px; --transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);
    --nav-h:86px;
    --nav-h-scrolled:62px;
    --shadow-drawer:10px 0 42px rgba(55,39,5,0.21);
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
    --safe-left:env(safe-area-inset-left,0px);
    --safe-right:env(safe-area-inset-right,0px);
    --drawer-w:min(390px,92vw);
    --spring:cubic-bezier(0.34,1.56,0.64,1);
    --out:cubic-bezier(0.16,1,0.3,1);
  }

  * { box-sizing:border-box; margin:0; padding:0; }
  html { scroll-behavior:smooth; }
  body { font-family:'Outfit',sans-serif; background:var(--off-white); color:var(--text-dark); overflow-x:hidden; }
  body.no-scroll { overflow:hidden; touch-action:none; }

  #particleCanvas { position:fixed; inset:0; pointer-events:none; z-index:0; opacity:0.3; }
  .mouse-light { position:fixed; width:500px; height:500px; border-radius:50%; background:radial-gradient(circle, rgba(205,164,52,0.07) 0%, transparent 70%); pointer-events:none; z-index:0; transform:translate(-50%,-50%); transition:transform 0.08s linear; }

  .liquid-glass { position:relative; overflow:hidden; }
  .liquid-glass::after { content:''; position:absolute; inset:0; pointer-events:none; background:radial-gradient(circle at 20% 30%, rgba(255,255,255,0.25) 0%, transparent 60%), radial-gradient(circle at 80% 70%, rgba(205,164,52,0.15) 0%, transparent 50%); mix-blend-mode:overlay; opacity:0.4; animation:liquidShimmer 8s ease-in-out infinite alternate; border-radius:inherit; }
  @keyframes liquidShimmer { 0%{transform:translate(-5%,-5%) scale(1); opacity:0.3;} 50%{transform:translate(5%,5%) scale(1.1); opacity:0.6;} 100%{transform:translate(-2%,3%) scale(0.95); opacity:0.4;} }

  nav#mainNav {
    position:fixed; top:0; left:0; right:0;
    z-index:3000;
    height:calc(var(--nav-h) + var(--safe-top));
    padding-top:var(--safe-top);
    padding-left:var(--safe-left);
    padding-right:var(--safe-right);
    background:rgba(253,246,214,.95);
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
    border-bottom:1px solid rgba(212,175,55,.12);
    box-shadow:0 2px 20px rgba(166,124,0,.08);
    transition:height .45s cubic-bezier(.4,0,.2,1), box-shadow .35s ease, background .3s ease;
    will-change:height;
  }
  nav#mainNav.scrolled {
    height:calc(var(--nav-h-scrolled) + var(--safe-top));
    background:rgba(253,246,214,.98);
    box-shadow:0 5px 34px rgba(166,124,0,.15);
  }
  .nav-inner { position:relative; width:100%; height:var(--nav-h); transition:height .45s cubic-bezier(.4,0,.2,1); }
  nav#mainNav.scrolled .nav-inner { height:var(--nav-h-scrolled); }

  .nav-left {
    position:absolute;
    left:max(8px,3vw);
    top:50%;
    transform:translateY(-50%);
    display:flex;
    align-items:center;
    gap:4px;
    z-index:20;
  }

  .hamburger {
    position:relative;
    width:50px; height:50px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px;
    border:0; border-radius:16px;
    background:transparent;
    color:var(--gold-main);
    cursor:pointer;
    padding:0;
    z-index:20;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    transition:background .2s ease;
  }
  .hamburger::before {
    content:"";
    position:absolute; inset:5px; border-radius:13px;
    background:rgba(212,175,55,0);
    transform:scale(.8);
    transition:background .25s ease, transform .25s var(--spring);
    z-index:-1;
  }
  .hamburger:hover::before, .hamburger:active::before { background:rgba(212,175,55,.13); transform:scale(1); }
  .hamburger:active { transform:scale(.95); }
  .hamburger span {
    display:block;
    width:26px; height:2.5px;
    flex:0 0 2.5px;
    border-radius:999px;
    background:currentColor;
  }

  .nav-logo {
    position:absolute;
    left:50%; top:9px;
    width:min(214px,54vw);
    height:60px;
    transform:translateX(-50%);
    display:flex; align-items:center; justify-content:center;
    z-index:10;
    text-decoration:none;
    transition:all .45s cubic-bezier(.4,0,.2,1);
  }
  .nav-logo img { display:block; width:100%; height:100%; object-fit:contain; }
  .nav-logo-text-fallback { font-family:'DM Serif Display',serif; font-size:1.55rem; color:var(--gold-main) !important; white-space:nowrap; }

  .nav-links { display:none; position:absolute; left:50%; bottom:14px; transform:translateX(-50%); gap:2px; list-style:none; z-index:5; }
  .nav-links a { display:block; padding:9px 16px; text-decoration:none; color:var(--text-mid); font-weight:500; font-size:0.93rem; border-radius:var(--radius-pill); transition:color .3s ease; position:relative; white-space:nowrap; background:transparent; }
  .nav-links a:hover, .nav-links a.active, .nav-links a.mega-active { color:var(--gold-main); }
  .nav-links a::after { content:''; position:absolute; bottom:2px; left:50%; transform:translateX(-50%) scaleX(0); width:18px; height:2px; background:var(--gold-main); border-radius:2px; transition:transform .3s ease; }
  .nav-links a:hover::after, .nav-links a.active::after, .nav-links a.mega-active::after { transform:translateX(-50%) scaleX(1); }

  .nav-icons {
    position:absolute;
    right:max(6px,3vw);
    top:50%;
    transform:translateY(-50%);
    display:flex;
    align-items:center;
    gap:2px;
    z-index:20;
  }
  .icon-btn {
    position:relative;
    width:44px; height:44px;
    display:flex; align-items:center; justify-content:center;
    padding:0;
    border:0; border-radius:14px;
    background:transparent;
    color:var(--text-mid);
    cursor:pointer;
    touch-action:manipulation;
    transition:all .22s var(--spring);
  }
  .icon-btn:hover, .icon-btn:active { background:rgba(212,175,55,.13); color:var(--gold-main); }
  .icon-btn svg { width:20px; height:20px; }
  .icon-btn .badge { position:absolute; top:2px; right:1px; min-width:18px; height:18px; padding:0 4px; display:flex; align-items:center; justify-content:center; border:2px solid var(--off-white); border-radius:99px; background:var(--gold-main); color:#fff; font-size:.60rem; font-weight:900; }
  .icon-btn .badge.hidden { display:none; }
  .icon-btn.search-trigger { width:44px; min-width:44px; padding:0; gap:0; }
  .icon-btn.search-trigger .icon-btn-label { display:none; }

  .search-trigger .st-icon-close { display:none; }
  .search-trigger.is-active .st-icon-search { display:none; }
  .search-trigger.is-active .st-icon-close { display:block; }
  .search-trigger.is-active { background:rgba(212,175,55,.18); color:var(--gold-main); }

  .skip-link { position:absolute; top:-40px; left:16px; background:var(--gold-main); color:#fff; padding:8px 16px; border-radius:var(--radius-pill); font-size:0.85rem; font-weight:700; z-index:2000; transition:top 0.3s; }
  .skip-link:focus { top:calc(12px + var(--safe-top)); }

  .page { display:none; position:relative; z-index:1; }
  .page.active { display:block; }
  main { padding-top:calc(var(--nav-h) + var(--safe-top)); min-height:100vh; }

  /* Hero */
  .hero { min-height:calc(100vh - var(--nav-h) - var(--safe-top)); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 5% 40px; background:linear-gradient(145deg,var(--off-white) 0%,var(--gold-pale) 60%,#f2debf 100%); position:relative; overflow:hidden; }
  .hero::before { content:''; position:absolute; top:-100px; right:-100px; width:460px; height:460px; background:radial-gradient(circle,rgba(212,175,55,0.3) 0%,transparent 70%); border-radius:50%; pointer-events:none; animation:floatA 9s ease-in-out infinite; }
  .hero::after { content:''; position:absolute; bottom:-80px; left:-80px; width:360px; height:360px; background:radial-gradient(circle,rgba(186,215,232,0.15) 0%,transparent 70%); border-radius:50%; pointer-events:none; animation:floatB 11s ease-in-out infinite; }
  @keyframes floatA { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-28px,18px)} }
  @keyframes floatB { 0%,100%{transform:translate(0,0)} 50%{transform:translate(18px,-28px)} }
  .hero-content { text-align:center; position:relative; z-index:1; max-width:780px; }
  .hero-badge { display:inline-flex; align-items:center; gap:8px; background:var(--gold-pale); border:1px solid var(--gold-light); color:var(--gold-deep); padding:6px 18px; border-radius:var(--radius-pill); font-size:0.82rem; font-weight:700; margin-bottom:28px; letter-spacing:0.05em; text-transform:uppercase; box-shadow:0 2px 10px rgba(212,175,55,0.12); }
  .hero h1 { font-family:'DM Serif Display',serif; font-size:clamp(2.4rem,7vw,5rem); line-height:1.1; color:var(--text-dark); margin-bottom:20px; }
  .hero h1 em { font-style:italic; color:var(--gold-main); }
  .hero p { font-size:1.1rem; color:var(--text-mid); max-width:500px; margin:0 auto 34px; line-height:1.75; }
  .hero-scroll { position:absolute; bottom:28px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:6px; color:var(--gray-mid); font-size:0.78rem; animation:bounce 2s infinite; cursor:pointer; }
  .hero-scroll-arrow { display:inline-flex; color:var(--gold-main); }
  @keyframes bounce { 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(6px)} }

  .btn-primary { background:var(--gold-main); color:#fff; border:none; cursor:pointer; padding:13px 32px; border-radius:var(--radius-pill); font-family:'Outfit',sans-serif; font-size:0.98rem; font-weight:700; box-shadow:var(--shadow-btn); transition:var(--transition); text-decoration:none; display:inline-block; }
  .btn-primary:hover { background:var(--gold-deep); transform:translateY(-3px) scale(1.03); }
  .btn-secondary { background:transparent; color:var(--gold-main); border:2px solid var(--gold-main); cursor:pointer; padding:11px 30px; border-radius:var(--radius-pill); font-family:'Outfit',sans-serif; font-size:0.98rem; font-weight:600; transition:var(--transition); text-decoration:none; display:inline-block; }
  .btn-secondary:hover { background:var(--gold-pale); transform:translateY(-3px); }

  .skeleton { background:linear-gradient(90deg,var(--gray-light) 25%,#fff8ee 50%,var(--gray-light) 75%); background-size:200% 100%; animation:shimmer 1.4s infinite; border-radius:12px; }
  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
  .skeleton-card { aspect-ratio:0.75; border-radius:4px; }

  .carousel-section { padding:64px 0 44px; background:var(--white); position:relative; z-index:1; }
  .carousel-title { text-align:center; margin-bottom:36px; font-family:'DM Serif Display',serif; font-size:2rem; color:var(--text-dark); }
  .carousel-title span { color:var(--gold-main); }
  .carousel-wrapper { position:relative; overflow:hidden; touch-action:pan-y; }
  .carousel-track { display:flex; gap:20px; padding:12px 5%; will-change:transform; align-items:stretch; }
  .carousel-card { min-width:262px; max-width:262px; flex-shrink:0; background:transparent; border:none; transition:transform 0.3s ease; cursor:pointer; display:flex; flex-direction:column; }
  .carousel-card:hover { transform:translateY(-4px); }
  .carousel-card .product-img-square { width:100%; aspect-ratio:1; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; background:#f2ede0; border-radius:4px; }
  .carousel-card .product-img-square img { width:100%; height:100%; object-fit:cover; transition:transform 0.4s ease; }
  .carousel-card:hover .product-img-square img { transform:scale(1.05); }
  .carousel-card .product-img-emoji { font-size:4rem; }
  .carousel-card .product-info { padding:12px 2px 4px; text-align:left; }
  .carousel-card .product-info h3 { font-size:0.9rem; font-weight:400; color:var(--text-dark); margin-bottom:4px; }
  .carousel-card .product-price { font-size:0.96rem; font-weight:600; color:var(--text-dark); }
  .carousel-card .product-colors-text { font-size:0.72rem; color:var(--text-mid); text-transform:uppercase; letter-spacing:0.06em; margin-top:4px; }

  .carousel-arrows { display:flex; justify-content:center; gap:12px; margin-top:16px; }
  .carousel-arrow { width:38px; height:38px; border-radius:50%; background:var(--gold-pale); border:2px solid var(--gold-light); color:var(--gold-main); font-size:1rem; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:var(--transition); }
  .carousel-arrow:hover { background:var(--gold-main); color:#fff; border-color:var(--gold-main); }

  .gender-section {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    padding:48px 5% 8px;
    max-width:1400px;
    margin:0 auto;
    position:relative;
    z-index:1;
  }
  .gender-card {
    position:relative;
    min-height:360px;
    border-radius:var(--radius-card);
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    background-color:#2a2210;
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    box-shadow:var(--shadow-card);
    transition:transform .4s var(--out), box-shadow .4s var(--out);
  }
  .gender-card::before {
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(42,34,16,.20) 0%, rgba(42,34,16,.58) 100%);
    transition:background .4s ease;
    z-index:1;
  }
  .gender-card:hover { transform:translateY(-4px); box-shadow:0 18px 46px rgba(166,124,0,.22); }
  .gender-card:hover::before { background:linear-gradient(180deg, rgba(42,34,16,.32) 0%, rgba(42,34,16,.70) 100%); }
  .gender-content {
    position:relative;
    z-index:2;
    text-align:center;
    color:#fff;
    padding:32px 24px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
  }
  .gender-content h3 {
    font-family:'DM Serif Display',serif;
    font-size:clamp(1.7rem,4vw,2.7rem);
    font-weight:400;
    line-height:1.15;
    letter-spacing:.01em;
    text-shadow:0 3px 22px rgba(0,0,0,.45);
  }
  .gender-cta {
    display:inline-block;
    padding:12px 30px;
    border-radius:var(--radius-pill);
    background:rgba(255,255,255,.14);
    border:2px solid rgba(255,255,255,.85);
    color:#fff;
    font-family:'Outfit',sans-serif;
    font-size:.82rem;
    font-weight:800;
    letter-spacing:.14em;
    text-transform:uppercase;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    transition:var(--transition);
  }
  .gender-card:hover .gender-cta {
    background:var(--gold-main);
    border-color:var(--gold-main);
    transform:translateY(-3px) scale(1.03);
    box-shadow:0 10px 26px rgba(205,164,52,.45);
  }
  @media (max-width:720px) {
    .gender-section { grid-template-columns:1fr; gap:12px; padding:36px 5% 4px; }
    .gender-card { min-height:250px; }
  }

  .features { padding:80px 5%; background:linear-gradient(180deg,var(--off-white) 0%,var(--gold-pale) 100%); position:relative; z-index:1; }
  .section-header { text-align:center; margin-bottom:52px; }
  .section-header h2 { font-family:'DM Serif Display',serif; font-size:clamp(1.7rem,4vw,2.7rem); color:var(--text-dark); margin-bottom:12px; }
  .section-header h2 span { color:var(--gold-main); }
  .section-header p { font-size:1rem; color:var(--text-mid); max-width:480px; margin:0 auto; line-height:1.75; }
  .features-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:22px; max-width:1080px; margin:0 auto; }
  .feature-card { background:rgba(255,255,255,0.75); backdrop-filter:blur(20px); border-radius:var(--radius-card); padding:30px 24px; box-shadow:var(--shadow-card),inset 0 1px 0 rgba(255,255,255,0.9); border:1px solid rgba(212,175,55,0.12); text-align:center; transition:var(--transition); cursor:default; position:relative; overflow:hidden; }
  .feature-card:hover { transform:translateY(-8px) scale(1.02); border-color:var(--gold-light); }
  .feature-icon { width:62px; height:62px; border-radius:50%; background:var(--gold-pale); display:flex; align-items:center; justify-content:center; font-size:1.7rem; margin:0 auto 16px; }
  .feature-card h3 { font-size:1rem; font-weight:700; margin-bottom:9px; color:var(--text-dark); }
  .feature-card p { font-size:0.88rem; color:var(--text-mid); line-height:1.65; }

  .products-hero { background:linear-gradient(135deg,var(--gold-pale) 0%,var(--off-white) 100%); padding:52px 5% 36px; text-align:center; }
  .products-hero h1 { font-family:'DM Serif Display',serif; font-size:clamp(1.9rem,5vw,3rem); color:var(--text-dark); margin-bottom:10px; }
  .products-hero p { color:var(--text-mid); font-size:0.98rem; max-width:460px; margin:0 auto; }
  .products-controls { padding:26px 5% 0; display:flex; gap:12px; flex-wrap:wrap; align-items:center; max-width:1240px; margin:0 auto; }
  .search-bar { flex:1; min-width:210px; display:flex; align-items:center; gap:10px; background:var(--white); border:2px solid rgba(212,175,55,0.2); border-radius:var(--radius-pill); padding:10px 18px; box-shadow:var(--shadow-soft); transition:var(--transition); }
  .search-bar:focus-within { border-color:var(--gold-main); box-shadow:0 0 0 4px rgba(212,175,55,0.1); }
  .search-bar input { flex:1; border:none; outline:none; font-family:'Outfit',sans-serif; font-size:0.92rem; color:var(--text-dark); background:transparent; }
  .search-bar input::placeholder { color:var(--gray-mid); }
  .search-clear { background:none; border:none; cursor:pointer; color:var(--gray-mid); font-size:1rem; display:none; padding:2px; }
  .search-clear.visible { display:block; }
  .filter-pills { display:flex; gap:8px; flex-wrap:wrap; }
  .filter-pill { padding:8px 16px; border-radius:var(--radius-pill); border:2px solid var(--gold-light); background:transparent; color:var(--text-mid); font-family:'Outfit',sans-serif; font-size:0.85rem; font-weight:600; cursor:pointer; transition:var(--transition); white-space:nowrap; }
  .filter-pill:hover { border-color:var(--gold-main); color:var(--gold-main); }
  .filter-pill.active { background:var(--gold-main); color:#fff; border-color:var(--gold-main); box-shadow:0 4px 12px rgba(212,175,55,0.3); }
  .products-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:20px; padding:30px 5% 60px; max-width:1240px; margin:0 auto; }
  .products-count { padding:0 5%; max-width:1240px; margin:12px auto 0; font-size:0.82rem; color:var(--text-mid); }

  /* Cabeçalho do filtro ativo na página de produtos */
  .products-filter-header {
    text-align: center;
    padding: 26px 5% 0;
    max-width: 1240px;
    margin: 0 auto;
  }
  .products-filter-title {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(1.3rem, 3.5vw, 1.7rem);
    font-weight: 400;
    color: var(--text-dark);
    display: inline-block;
    padding-bottom: 10px;
    border-bottom: 3px solid var(--gold-main);
    margin-bottom: 4px;
    line-height: 1.2;
  }
  .products-filter-header + .products-count { margin-top: 10px; }

  .blog-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:26px; padding:30px 5% 60px; max-width:1240px; margin:0 auto; }
  .blog-card { background:var(--white); border-radius:var(--radius-card); overflow:hidden; box-shadow:var(--shadow-card); border:1px solid rgba(212,175,55,0.12); cursor:pointer; transition:var(--transition); display:flex; flex-direction:column; }
  .blog-card:hover { transform:translateY(-6px); box-shadow:0 18px 44px rgba(166,124,0,0.18); border-color:var(--gold-light); }

  .product-page-add-btn { width: 100%; background: var(--gold-main); color: #fff; border: none; cursor: pointer; padding: 15px; border-radius: 0 16px 0 16px; font-family: 'Outfit', sans-serif; font-size: 1rem; font-weight: 700; letter-spacing: 0.04em; box-shadow: var(--shadow-btn); transition: var(--transition); margin-top: 14px; }

  .product-page-specs summary::-webkit-details-marker { display: none; }

  .product-page-related { padding: 56px 0 40px; border-top: 1px solid rgba(42,34,16,0.08); margin-top: 40px; }

  .product-page-block a { font-size: 0.8rem; font-weight: 700; color: var(--gold-main); letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; text-decoration: none; display: inline-block; }

  @media (max-width: 900px) {

    .product-page-title { font-size: 1.15rem; }

  }

     PÁGINA DE CONTA DO USUÁRIO

  /* Modal Produto (compatibilidade) */
  .modal-overlay { position:fixed; inset:0; background:rgba(42,34,16,0.65); z-index:2000; display:flex; align-items:center; justify-content:center; padding:16px; opacity:0; pointer-events:none; transition:opacity 0.3s; }

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Bar — Gold Crochet</title>
    <style>
        /* ═══════════════════════════════════════
           TOP BAR — Componente isolado
        ═══════════════════════════════════════ */
        :root {
            --gold-main: #cda434;
            --gold-light: #e8cd82;
            --dark: #1a1405;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            /* Fundo claro para visualizar o componente */
            background: #fdf6d6;
            padding-top: 40px; /* espaço para a barra fixa */
        }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 32px;
            background: var(--dark);
            color: var(--gold-light);
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 28px;
            z-index: 1000;
            letter-spacing: 0.03em;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            transition: background 0.3s;
        }

        .top-bar a {
            color: var(--gold-light);
            text-decoration: none;
            transition: color 0.2s;
        }

        .top-bar a:hover {
            color: #ffffff;
        }

        /* Conteúdo de exemplo para demonstrar a barra fixa */
        .content {
            padding: 40px;
            text-align: center;
            color: #6b5b3a;
            font-size: 1.2rem;
        }

        /* Responsividade */
        @media (max-width: 640px) {
            .top-bar {
                font-size: 0.65rem;
                gap: 10px;
                padding: 0 10px;
                justify-content: space-between;
            }

            /* Esconde alguns itens em telas muito pequenas */
            .top-bar .hide-mobile {
                display: none;
            }
        }

        /* Opcional: animação para hover */
        .top-bar a {
            position: relative;
        }

        .top-bar a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 1px;
            background: #fff;
            transition: width 0.3s;
        }

        .top-bar a:hover::after {
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- ═══════════════════════════════════════
         TOP BAR (Rodapé Superior)
    ═══════════════════════════════════════ -->
    <div class="top-bar">
        <span>✦ Frete grátis acima de R$200</span>
        <span class="hide-mobile">Parcele em até 3x sem juros</span>
        <a href="https://wa.me/553182032351" class="hide-mobile">Atendimento via WhatsApp</a>
    </div>

    <!-- Conteúdo de exemplo -->
    <div class="content">
        <h1>Página de exemplo</h1>
        <p>Role a página para ver a barra fixa no topo.</p>
    </div>

</body>
</html>
